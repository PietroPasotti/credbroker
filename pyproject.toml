[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credbroker"
version = "0.1.0"
description = "Policy-gated GitHub credential broker: gh and git for credential-less hosts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Pietro Pasotti", email = "pietro.pasotti@canonical.com" },
]
dependencies = []

[project.scripts]
credbroker = "credbroker.cli:main"
credx = "credbroker.credx:main"

[tool.hatch.build.targets.wheel]
packages = ["src/credbroker"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
